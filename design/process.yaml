property-tests:
  kind: verification
  on: zigdag.core.language
  serves: [maintain.unrelated-breakage]
  evidence: property-test

max-lines:
  except:
    - cli.plans  # 1,033 lines when the file limit arrived: every command's decisions in one file; splitting it by command is debt to pay down

described-names:
  off: true  # zigdag's own interface names are not described yet: see the defect raised on described-names in the log

stop-on-error:
  kind: workflow
  on: zigdag
  serves: [keep-design-true.drift-unnoticed]
  gate: stop-on-error

countermeasure-on-escape:
  kind: workflow
  on: zigdag
  serves: [track-concerns.forgotten-concern]
  gate: countermeasure-on-escape

planned-effects:  # the watcher's functions with effects react to the tests as they run, inside Python's monitoring callbacks; moving their decisions into pure code is debt to pay down
  except:
    - watchers.python.pytest_configure
    - watchers.python._Hooks.pytest_sessionfinish
    - watchers.python.watcher.Watcher.start
    - watchers.python.watcher.Watcher.end
    - watchers.python.watcher.Watcher.printed
    - watchers.python.watcher.Watcher.finish
    - watchers.python.watcher.Watcher.mutate
    - watchers.python.mutants.mutants
    - watchers.python.mutants._fate
    - watchers.python.mutants._limit
    - watchers.python.mutants._compiled
    - watchers.python.mutants._searched
    - watchers.python.search.search
    - watchers.python.search._crosshair

lint:
  kind: code-rule
  on: zigdag
  serves: [change-safely.broken-promise]
  check: lint

types:  # known breaks when the rule arrived: modules, or for a package's own file its functions, that ty fails today; debt to pay down, and an excepted module can gain new type errors unseen until it leaves this list
  kind: code-rule
  on: zigdag
  serves: [change-safely.data-mismatch]
  check: types
  except:
    - adapters.python._observed
    - adapters.python.observed
    - adapters.python.plans
    - adapters.python.read_python
    - adapters.python.scan
    - adapters.python.tests
    - agents.claude
    - cli.commands
    - cli.files
    - cli.main
    - cli.plans
    - core.checks.code_rules
    - core.checks.context
    - core.checks.data_rules
    - core.checks.evidence
    - core.checks.gates
    - core.checks.interface_rules
    - core.checks.mutation_rules
    - core.checks.record_rules
    - core.checks.rules
    - core.checks.run
    - core.code
    - core.codec
    - core.critique
    - core.data
    - core.effects
    - core.findings
    - core.init
    - core.kinds.params
    - core.kinds.registry
    - core.language.lexicons
    - core.language.quality
    - core.language.sentences
    - core.language.tokens
    - core.log
    - core.names
    - core.record.builtins
    - core.record.entries
    - core.record.fmt
    - core.record.read
    - core.record.tree
    - core.relate
    - core.rename
    - core.resolve
    - core.review
    - core.settings
    - core.views
    - core.watch
    - verifies
    - watchers.python.mutants
    - watchers.python.pytest_configure
    - watchers.python.search
    - watchers.python.watcher

security:
  kind: code-rule
  on: zigdag
  serves: [keep-design-true.hidden-effect]
  check: security
  except:
    - watchers.python.mutants._compiled  # it runs the project's own code, edited, with exec: that is what a mutant is
    - adapters.python.tests.read_reports  # the JUnit report the project's own tests wrote; Python's expat refuses the entity attacks bandit warns of
    - adapters.terraform.tests.read_report  # the JUnit report terraform test wrote for the project; the same holds
    - adapters.typescript.tests.read_report  # the JUnit report vitest wrote for the project; the same holds
    - cli.commands.test  # it starts the project's tests: the cli's job
    - cli.files._git  # it runs git, with arguments zigdag makes
    - cli.files.ran  # it starts the project's own linter, type checker and security checker
    - cli.files.loaded  # it runs the project's own files of custom checks: that is what loading one is, and a file with an effect is never run
