frs:
  zigdag:
    statements:
      check: The zigdag shall check a design record against the code that the record describes.

  zigdag.core:
    serves: [keep-design-true.drift-unnoticed, keep-design-true.different-answers]
    statements:
      find: The core shall turn the text of a project into findings.
      same-findings: When given the same project text twice, the core shall return the same findings.

  zigdag.core.vocabulary:
    statements:
      define: The vocabulary shall define the words that the rest of the core shares.

  zigdag.core.vocabulary.names:
    statements:
      read: The names shall read each kind of name that the record uses.
      parts: When a code name is inside another, the names shall tell the names apart by the dots and the slashes that join the parts.
      branches: When a design parameter is built on a branch, the names shall name the branch after the design parameter.

  zigdag.core.vocabulary.names.code_name:
    statements:
      hold: The code name shall name code by the adapter of the code and the path of the code.

  zigdag.core.vocabulary.names.outcome_ref:
    statements:
      hold: The outcome ref shall name an outcome by the job of the outcome and the name of the outcome.

  zigdag.core.vocabulary.names.statement_ref:
    statements:
      hold: The statement ref shall name a statement by the FR and the name of the statement.

  zigdag.core.vocabulary.findings:
    statements:
      carry: The findings shall give each result the rule, the subject and the place that produced the result.

  zigdag.core.vocabulary.findings.finding:
    statements:
      hold: The finding shall give the result, the rule, the subject and the place of one thing that a check found.

  zigdag.core.vocabulary.findings.report:
    statements:
      hold: The report shall list the findings of a run in order.
      passes: If a run found a break or an open question or a test result that is out of date, then the report shall count the run as failed.

  zigdag.core.vocabulary.findings.result:
    statements:
      hold: The result shall name whether a check found a break, a question, a thing to do or a test result that is out of date.

  zigdag.core.vocabulary.findings.span:
    statements:
      hold: The span shall locate a value in a file by the line and the column of the value.

  zigdag.core.vocabulary.effects:
    statements:
      define: The effects shall define the closed list of effect names.

  zigdag.core.vocabulary.kinds:
    statements:
      define: The kinds shall define each check kind with the parameters and the sentence of the check kind.

  zigdag.core.vocabulary.kinds.param_spec:
    statements:
      hold: The param spec shall hold the type and the default value of one parameter of a check.

  zigdag.core.vocabulary.kinds.param_problem:
    statements:
      hold: The param problem shall describe a rule parameter that does not fit the schema of the parameter.

  zigdag.core.vocabulary.kinds.param_type:
    statements:
      hold: The param type shall name the kind of value that a rule parameter takes.

  zigdag.core.vocabulary.kinds.check_kind:
    statements:
      hold: The check kind shall define the parameters, the reads, the exactness, the sentence and the direction of a check.

  zigdag.core.vocabulary.kinds.direction:
    statements:
      hold: The direction shall name one way of judging the quality of code.

  zigdag.core.vocabulary.kinds.exactness:
    statements:
      hold: The exactness shall name whether a failing check breaks or asks a question.

  zigdag.core.vocabulary.kinds.part:
    statements:
      hold: The part shall name a part of the code model that a check reads.

  zigdag.core.vocabulary.texts:
    statements:
      name: The texts shall name each kind of text that zigdag reads, writes or shows.

  zigdag.core.vocabulary.measures:
    statements:
      name: The measures shall name each number that zigdag counts or places things by.

  zigdag.core.vocabulary.codec:
    statements:
      round-trip: The codec shall write each value that one process hands another as text that reads back to the same value.

  zigdag.core.vocabulary.codec.unreadable_text:
    statements:
      hold: The unreadable text shall give the reason that the codec refused a text.

  zigdag.core.language:
    statements:
      parse: The language shall parse each sentence against the grammar for the sentence.
      never-raise: When given any text, the language shall return a result without raising an exception.

  zigdag.core.language.lexicon_name:
    statements:
      hold: The lexicon name shall name a lexicon that a project can tune.

  zigdag.core.language.lexicons:
    statements:
      hold: The lexicons shall hold the words that the grammar and the quality checks use.

  zigdag.core.language.ears:
    statements:
      hold: The ears shall hold the parts of one parsed EARS statement.

  zigdag.core.language.problem:
    statements:
      hold: The problem shall describe something wrong with a sentence.

  zigdag.core.language.token:
    statements:
      hold: The token shall hold one word of a sentence with the position of the word.

  zigdag.core.language.pattern:
    statements:
      hold: The pattern shall name the EARS pattern that a statement follows.

  zigdag.core.language.data_clause:
    statements:
      hold: The data clause shall hold the structure, the field and the value that a clause of a statement names.

  zigdag.core.language.bound:
    statements:
      hold: The bound shall give one limit that a statement puts on the time, the memory or the growth of the cost of a design parameter.

  zigdag.core.language.characteristic:
    statements:
      hold: The characteristic shall name what a performance bound limits.

  zigdag.core.record:
    statements:
      read: The record shall read the design files into a record with the place of every value.
      text-only: When reading a design file, the record shall read every value as text.
      keep-all: When formatting a design file, the record shall keep every value and every comment.
      stable: When formatting a formatted design file, the record shall return the same text.
      digest: When an entry changes, the record shall give the entry a new digest.

  zigdag.core.record.contents:
    statements:
      hold: The contents shall hold what the design files say.

  zigdag.core.record.contents.record:
    statements:
      hold: The record shall hold everything that the design files say.

  zigdag.core.record.contents.job:
    statements:
      hold: The job shall hold one job with the performer and the outcomes of the job.

  zigdag.core.record.contents.outcome:
    statements:
      hold: The outcome shall hold one outcome with the statement of the outcome.

  zigdag.core.record.contents.fr:
    statements:
      hold: The fr shall hold one FR with the statements of the FR and the outcomes that the FR serves.

  zigdag.core.record.contents.at:
    statements:
      hold: The at shall locate a value of the record where the value is written.

  zigdag.core.record.contents.domain:
    statements:
      hold: The domain shall name the domain that a design file belongs to.

  zigdag.core.record.contents.placement:
    statements:
      hold: The placement shall map a design parameter to the units of the code of the design parameter.

  zigdag.core.record.contents.yaml_entry:
    statements:
      hold: The yaml entry shall hold one key of a design file with the value and the reason of the key.

  zigdag.core.record.rules:
    statements:
      hold: The rules shall hold the constraints, the process variables and the tunings of the record.

  zigdag.core.record.rules.constraint:
    statements:
      hold: The constraint shall hold one constraint with the FR, the outcomes and the enforcement of the constraint.

  zigdag.core.record.rules.process_variable:
    statements:
      hold: The process variable shall hold one process variable with the design parameter and the outcomes of the variable.

  zigdag.core.record.rules.check_use:
    statements:
      hold: The check use shall name the check kind that a rule uses, with the parameters and the exceptions of the rule.

  zigdag.core.record.rules.excepted:
    statements:
      hold: The excepted shall name the code that a rule skips, with the reason.

  zigdag.core.record.rules.tuning:
    statements:
      hold: The tuning shall hold what an entry changes about a built-in rule.

  zigdag.core.record.rules.gate:
    statements:
      hold: The gate shall name a gate that each change passes before the change is accepted.

  zigdag.core.record.rules.evidence_kind:
    statements:
      hold: The evidence kind shall name the kind of evidence that a statement needs.

  zigdag.core.record.entries:
    statements:
      hold: The entries shall give each entry of the record a name and a digest.

  zigdag.core.record.entries.entry:
    statements:
      hold: The entry shall give one entry of the record a name, a domain and a digest.

  zigdag.core.record.entries.entry_kind:
    statements:
      hold: The entry kind shall name what kind of entry an entry is.

  zigdag.core.record.sentences:
    statements:
      hold: The sentences shall hold the sentences of the record with the place of each sentence.

  zigdag.core.record.sentences.sentence:
    statements:
      hold: The sentence shall hold one sentence of the record with the place of the sentence.

  zigdag.core.record.sentences.statement:
    statements:
      hold: The statement shall hold one named statement of an FR.

  zigdag.core.settings:
    statements:
      read: The settings shall read zigdag.toml into settings.

  zigdag.core.settings.custom_check:
    statements:
      hold: The custom check shall define a check kind that a project registers.

  zigdag.core.settings.custom_effect:
    statements:
      hold: The custom effect shall name the calls that perform an effect that a project registers.

  zigdag.core.settings.settings:
    statements:
      hold: The settings shall hold how zigdag runs on a project.

  zigdag.core.workflow:
    statements:
      keep: The workflow shall keep what people and agents decide about a design.

  zigdag.core.workflow.log:
    statements:
      keep: The log shall keep each event that people and agents add, in time order.
      answered-once: When a question was answered for the current content, the log shall leave the question out of the findings.
      edited-lines: If a raised line no longer matches the id of the line, then the log shall report a break.

  zigdag.core.workflow.log.answer:
    statements:
      hold: The answer shall name how a thread or a question was answered.

  zigdag.core.workflow.log.approval:
    statements:
      hold: The approval shall record that someone approved an entry at the current content of the entry.

  zigdag.core.workflow.log.critique_event:
    statements:
      hold: The critique event shall record that a critic answered the rubric about an entry.

  zigdag.core.workflow.log.kind:
    statements:
      hold: The kind shall name whether a raised thread is a defect, a question or an idea.

  zigdag.core.workflow.log.log:
    statements:
      hold: The log shall keep the events that people and agents added, in time order.

  zigdag.core.workflow.log.thread:
    statements:
      hold: The thread shall hold a raised finding with the answers to the finding.

  zigdag.core.workflow.review:
    statements:
      show: The review shall show what a change does to the record, domain by domain.
      renames: When an entry leaves one name and returns unchanged under another, the review shall show a rename.

  zigdag.core.workflow.review.change:
    statements:
      hold: The change shall record what a change did to one entry of the record.

  zigdag.core.workflow.review.change_kind:
    statements:
      hold: The change kind shall name whether an entry was added, changed, removed or renamed.

  zigdag.core.workflow.critique:
    statements:
      ask: The critique shall ask a fresh critic the rubric questions about each chosen entry.
      quotes: If a critic's evidence is not words from the entry, then the critique shall refuse the finding.

  zigdag.core.workflow.critique.judgement:
    statements:
      hold: The judgement shall hold the findings that a critic raised about one entry.

  zigdag.core.workflow.rename:
    statements:
      everywhere: The rename shall rename an FR everywhere that the record and the tests use the name.
      keeps-code: When an FR is renamed, the rename shall keep the code that the FR pointed at.

  zigdag.core.code:
    statements:
      hold: The code shall hold what an adapter read from the code of a project, in terms of no language.

  zigdag.core.code.model:
    statements:
      hold: The model shall hold the code model with the units and the libraries of the code model.
      joined: When more than one adapter reads a project, the model shall join what the adapters read into one code model.
      same-name: If two adapters name a unit alike, then the model shall report a break.

  zigdag.core.code.model.code_model:
    statements:
      hold: The code model shall hold what an adapter read from the code of a project.

  zigdag.core.code.model.unit:
    statements:
      hold: The unit shall hold one module, package or table of the project.

  zigdag.core.code.model.unit_kind:
    statements:
      hold: The unit kind shall name whether a unit is a module, a package, a table or a deployed resource.

  zigdag.core.code.model.resources:
    statements:
      hold: The resources shall hold what the code uses and what the infrastructure grants of the deployed resources.

  zigdag.core.code.model.resources.resource_access:
    statements:
      hold: The resource access shall name whether a resource is read or written.

  zigdag.core.code.model.resources.resource_use:
    statements:
      hold: The resource use shall hold one call to a client of a deployed resource.

  zigdag.core.code.model.resources.setting:
    statements:
      hold: The setting shall hold one setting of a deployed unit that names another resource.

  zigdag.core.code.model.resources.grant:
    statements:
      hold: The grant shall hold the access that the infrastructure grants on one resource.

  zigdag.core.code.model.level:
    statements:
      hold: The level shall name whether a part of the design is a system, a container, a component or a structure.

  zigdag.core.code.model.libraries:
    statements:
      hold: The libraries shall list the packages that the project declares or vendors, with the standard library.

  zigdag.core.code.model.place:
    statements:
      hold: The place shall locate the symbol of a unit, or the top-level code of a unit, where code runs.

  zigdag.core.code.symbols:
    statements:
      hold: The symbols shall describe the names that the code defines.

  zigdag.core.code.symbols.symbol:
    statements:
      hold: The symbol shall describe one name that a unit defines.

  zigdag.core.code.symbols.symbol_kind:
    statements:
      hold: The symbol kind shall name whether a symbol is a function, a class, a method, a named type or a constant.

  zigdag.core.code.symbols.signature:
    statements:
      hold: The signature shall list the parameters and the return type of an operation.

  zigdag.core.code.symbols.param:
    statements:
      hold: The param shall describe one parameter of an operation with how the body uses the parameter.

  zigdag.core.code.symbols.field:
    statements:
      hold: The field shall describe one field of a class.

  zigdag.core.code.symbols.type_expr:
    statements:
      hold: The type expr shall describe a type as the code writes the type.

  zigdag.core.code.symbols.type_kind:
    statements:
      hold: The type kind shall name the kind of type that a type expr is.

  zigdag.core.code.symbols.abstraction:
    statements:
      hold: The abstraction shall name whether a class is a protocol or an abstract base class.

  zigdag.core.code.uses:
    statements:
      hold: The uses shall record how code reaches other code, effects and data.

  zigdag.core.code.uses.dependency:
    statements:
      hold: The dependency shall record that a place depends on a name.

  zigdag.core.code.uses.dependency_kind:
    statements:
      hold: The dependency kind shall name whether a dependency is an import or a reference.

  zigdag.core.code.uses.call:
    statements:
      hold: The call shall record that a place calls a name.

  zigdag.core.code.uses.effect_start:
    statements:
      hold: The effect start shall record that a place starts an effect through an API.

  zigdag.core.code.uses.type_of:
    statements:
      hold: The type of shall describe what one file says about the type of a value.

  zigdag.core.code.uses.access:
    statements:
      hold: The access shall record that a place reads or changes a field of a value.

  zigdag.core.code.uses.access_kind:
    statements:
      hold: The access kind shall name whether an access creates, reads, updates or deletes.

  zigdag.core.code.uses.raise:
    statements:
      hold: The raise shall record that a place raises an error.

  zigdag.core.code.uses.unknown:
    statements:
      hold: The unknown shall locate code whose behaviour the adapter cannot read.

  zigdag.core.code.values:
    statements:
      hold: The values shall record where values come from and where values go.

  zigdag.core.code.values.use:
    statements:
      hold: The use shall record a value that code gives to a release point or an effect.

  zigdag.core.code.values.use_kind:
    statements:
      hold: The use kind shall name whether a use releases a value or gives the value to an effect.

  zigdag.core.code.values.planned_use:
    statements:
      hold: The planned use shall record a value that comes from a plan unless the function of the value is pure.

  zigdag.core.code.values.value_source:
    statements:
      hold: The value source shall record where a value inside a function comes from.

  zigdag.core.code.values.source:
    statements:
      hold: The source shall name the kind of place that a value comes from.

  zigdag.core.code.values.need:
    statements:
      hold: The need shall name whether a value is given to a call or branched on.

  zigdag.core.code.values.computation:
    statements:
      hold: The computation shall locate a comparison, arithmetic or logic that a function works out.

  zigdag.core.code.tests:
    statements:
      hold: The tests shall describe the tests of a project with what the tests did.

  zigdag.core.code.tests.test:
    statements:
      hold: The test shall describe one test with the statements that the test verifies.

  zigdag.core.code.tests.link:
    statements:
      hold: The link shall name the statement that a test verifies.

  zigdag.core.code.tests.outcome:
    statements:
      hold: The outcome shall name whether a test passed, failed, errored or was skipped.

  zigdag.core.code.tests.run:
    statements:
      hold: The run shall record one test with the units whose code ran.

  zigdag.core.code.tests.observations:
    statements:
      hold: The observations shall hold what the watcher saw while the tests ran.

  zigdag.core.code.tests.crossing:
    statements:
      hold: The crossing shall record a value that crossed into an operation from another design parameter.

  zigdag.core.code.tests.escape:
    statements:
      hold: The escape shall record an error that left an operation for another design parameter.

  zigdag.core.code.tests.leak:
    statements:
      hold: The leak shall record the text of a protected value that code wrote to an effect.

  zigdag.core.code.generated_tests:
    statements:
      hold: The generated tests shall record the tests that zigdag generates with what each test found.

  zigdag.core.code.generated_tests.replay:
    statements:
      hold: The replay shall record a call that the watcher made again with a copy of the arguments of the call.

  zigdag.core.code.generated_tests.verdict:
    statements:
      hold: The verdict shall name whether a replayed call gave the same result.

  zigdag.core.code.generated_tests.cases:
    statements:
      hold: The cases shall record how the generated cases of a contract went.

  zigdag.core.code.generated_tests.mutant:
    statements:
      hold: The mutant shall record one change to a pure function with what noticed the change.

  zigdag.core.code.generated_tests.mutant_fate:
    statements:
      hold: The mutant fate shall name whether anything noticed a mutant.

  zigdag.core.code.generated_tests.witness:
    statements:
      hold: The witness shall give an input that a function and a mutant of the function behave differently on.

  zigdag.core.code.generated_tests.search_bound:
    statements:
      hold: The search bound shall limit the search for an input that a mutant behaves differently on to a number of paths and a number of seconds.

  zigdag.core.code.diagnostics:
    statements:
      hold: The diagnostics shall record what the linter and the type checker of a project report about the code.

  zigdag.core.code.diagnostics.diagnostic:
    statements:
      hold: The diagnostic shall record one rule of a tool that a place in the code breaks.

  zigdag.core.code.diagnostics.diagnosis:
    statements:
      hold: The diagnosis shall name what a tool checks the code for.

  zigdag.core.code.diagnostics.severity:
    statements:
      hold: The severity shall name how much a tool says that a diagnostic matters.

  zigdag.core.analysis:
    statements:
      check: The analysis shall check the record against the code model.

  zigdag.core.analysis.resolve:
    statements:
      own: The resolve shall give every unit of code exactly one design parameter.
      supporting: When the record places a supporting resource nowhere, the resolve shall give the supporting resource the design parameter of the container that the supporting resource supports.
      own-adapter: If a code name names no code of the adapter of the code name, then the resolve shall report a break.

  zigdag.core.analysis.resolve.dp:
    statements:
      hold: The dp shall hold a design parameter with the parent, the children, the code and the level of the design parameter.

  zigdag.core.analysis.resolve.tree:
    statements:
      hold: The tree shall map every unit of code to the design parameter that owns the unit.

  zigdag.core.analysis.relate:
    statements:
      reach: The relate shall work out the effects that each place in the code reaches through calls.

  zigdag.core.analysis.relate.edge:
    statements:
      hold: The edge shall link a place in one design parameter to the code in another design parameter that the place depends on.

  zigdag.core.analysis.relate.resource_effect:
    statements:
      hold: The resource effect shall hold one call to a client of a deployed resource with the container that the call reads or writes.

  zigdag.core.analysis.relate.origin:
    statements:
      hold: The origin shall locate where an effect starts with the API that the effect starts with.

  zigdag.core.analysis.relate.relations:
    statements:
      hold: The relations shall hold the edges, the design matrices and the effects that each place reaches.

  zigdag.core.analysis.relate.target:
    statements:
      hold: The target shall classify a name as project code, vendored code, the standard library or a third party.

  zigdag.core.analysis.watch:
    statements:
      plan: The watch shall plan what a test watcher watches in the code of a project.

  zigdag.core.analysis.watch.guarded_structure:
    statements:
      hold: The guarded structure shall name a recorded structure with the one component that changes the structure.

  zigdag.core.analysis.watch.mutation_target:
    statements:
      hold: The mutation target shall name a pure function with a contract and the bound of the search for the mutants of the function.

  zigdag.core.analysis.watch.watch_plan:
    statements:
      hold: The watch plan shall tell a watcher what to watch while the tests run.

  zigdag.core.analysis.watch.last_run:
    statements:
      hold: The last run shall give the mutants that the last watched run made with the digest of the file of each test.

  zigdag.core.analysis.profile:
    statements:
      sum: The profile shall add up the time and the memory of a profiled run of the tests by design parameter.

  zigdag.core.analysis.profile.profile:
    statements:
      hold: The profile shall hold the time and the memory of each line of code in a profiled run of the tests.

  zigdag.core.analysis.profile.profiled_line:
    statements:
      hold: The profiled line shall give the share of the time and the memory that one line of code took in a profiled run.

  zigdag.core.analysis.profile.cost:
    statements:
      hold: The cost shall give the share of the time and the memory that one part of the project took in a profiled run.

  zigdag.core.analysis.profile.comparison:
    statements:
      hold: The comparison shall give the cost of one part of the project in a profiled run beside the cost of the part in the run before.

  zigdag.core.analysis.profile.leak:
    statements:
      hold: The leak shall give a line of code that the profiler suspects of leaking memory, with the likelihood of the leak and the growth of the memory.

  zigdag.core.analysis.profile.suspect:
    statements:
      hold: The suspect shall give a suspected leak with the part of the project that the code of the leak belongs to.

  zigdag.core.analysis.data:
    statements:
      work-out: The data shall work out each recorded structure with the structures that the structure contains and refers to.

  zigdag.core.analysis.data.cardinality:
    statements:
      hold: The cardinality shall name how many structures a field holds.

  zigdag.core.analysis.data.data_access:
    statements:
      hold: The data access shall record the code of a design parameter that creates, reads or changes a structure.

  zigdag.core.analysis.data.data_model:
    statements:
      hold: The data model shall hold every recorded structure with the structures that the structure contains and refers to.

  zigdag.core.analysis.data.relation:
    statements:
      hold: The relation shall link a field of one structure to the structure that the field contains or refers to.

  zigdag.core.analysis.data.structure:
    statements:
      hold: The structure shall hold one recorded structure with the representations of the structure.

  zigdag.core.analysis.data.value_use:
    statements:
      hold: The value use shall record a value that code gives to a release point or an effect.

  zigdag.core.analysis.checks:
    statements:
      report: The checks shall report every break, question and thing to do in a project.
      directions: When a run of the checks ends, the checks shall tell for each direction of quality whether every check of the direction passed.
      gates: When a gate is in force, the checks shall report each changed entry that has not passed the gate.
      data: When a rule covers data, the checks shall report each use of the data that the rule does not allow.
      states: When a statement names a state or a feature, the checks shall report each state or feature that the data does not have.
      evidence-runs: If a test ran no code of the design parameter that the test verifies, then the checks shall report a break.
      permitted: If code has a resource effect that the infrastructure does not grant, then the checks shall report a break.
      least: If the infrastructure grants access that no code uses, then the checks shall report a question.
      not-read: If a rule covers code whose adapter does not read what the rule reads, then the checks shall report a question.
      evidence-current: When a test passed against code that has changed since, the checks shall report the evidence as out of date.
      narrow: If a function that another design parameter uses reads a single field of a class that the function takes, then the checks shall ask about the function.
      single-implementation: If an abstraction has exactly one implementation, then the checks shall ask about the abstraction.
      weak-contracts: If every case of a contract holds for a changed function, then the checks shall ask about the change.
      called-contracts: If no inputs are generated for a contract, then the checks shall count the calls of the tests as the cases of the contract.
      unmutated: If code is marked to be left unmutated outside the except of the rule, then the checks shall report a break.
      planned: If a function that is not declared pure works out a value or uses a value that no pure function decided, then the checks shall report a break.
      contracted: If a function that is declared pure and that an interface offers has no contract, then the checks shall report a break.
      diagnosed: When a rule that a tool checks is in force, the checks shall report each diagnostic of the tool inside the scope of the rule.
      oversized: If a function or a class or a file has more lines than the rule allows, then the checks shall report a break.
      undesigned: If a file of code is one that no design parameter names, then the checks shall report a break.
      custom: When a rule names a check that the project wrote, the checks shall report what the check of the project finds.
      custom-refused: If a file of custom checks has an effect, then the checks shall report a break.
      changed-statements: If a statement changed since the base of a change and no test that verifies the statement changed, then the checks shall report a thing to do.
      stay-in-part: If the branch of a design parameter changes a file outside the design parameter, then the checks shall report a break.
      settled-first: If the branch of a design parameter changes a name that another design parameter uses, then the checks shall report a break.

  zigdag.core.analysis.checks.part_branch:
    statements:
      hold: The part branch shall hold the branch that one design parameter is built on, as git has the branch.

  zigdag.core.analysis.checks.loaded_checks:
    statements:
      hold: The loaded checks shall hold the checks that one file of custom checks defines.

  zigdag.core.analysis.checks.custom_checks:
    statements:
      hold: The custom checks shall hold each check that the project wrote under the check kind of the check.

  zigdag.core.analysis.checks.loading:
    statements:
      hold: The loading shall hold the compiled code of one file of custom checks.

  zigdag.core.analysis.checks.context:
    statements:
      hold: The context shall give every check the record, the code and what zigdag worked out.

  zigdag.core.analysis.checks.rule_use:
    statements:
      hold: The rule use shall hold one rule in force with the parameters, the FR and the skipped code of the rule.

  zigdag.core.analysis.checks.analysis:
    statements:
      hold: The analysis shall hold everything that one run of zigdag worked out about a project.

  zigdag.core.analysis.checks.project_files:
    statements:
      hold: The project files shall hold the text of the settings, the record and the log of a project.

  zigdag.core.analysis.checks.standing:
    statements:
      hold: The standing shall give the findings of one direction of quality with whether every check of the direction passed.

  zigdag.core.analysis.work:
    statements:
      next: The work shall tell what to do next on a change that is built one design parameter at a time.
      asked: When a change adds or changes a statement, the work shall ask the design parameter of the statement for a test of the statement.
      waiting: If a failing test ran the code of a design parameter that the change still asks of, then the work shall count the test as waiting.
      stops: If a question that was raised since the base of a change is open, then the work shall give no design parameter to build.
      delta: When asked about one design parameter, the work shall give each changed entry that concerns the design parameter.

  zigdag.core.analysis.work.asked_work:
    statements:
      hold: The asked work shall hold what a change asks of one design parameter.

  zigdag.core.analysis.work.waiting_tests:
    statements:
      hold: The waiting tests shall tell the failing tests that wait for another design parameter from the failing tests of the branch.

  zigdag.core.analysis.work.taken_part:
    statements:
      hold: The taken part shall hold a design parameter whose branch exists with the project in the folder of the branch.

  zigdag.core.analysis.work.answer:
    statements:
      hold: The answer shall hold what to do next on a change with each reason.

  zigdag.core.analysis.work.step:
    statements:
      hold: The step shall name what there is to do next on a change.

  zigdag.core.analysis.work.part_delta:
    statements:
      hold: The part delta shall hold what a change says of one design parameter.

  zigdag.core.views:
    statements:
      show: The views shall show a design parameter with the rules and the code around the design parameter.
      changed: When a context has a base, the views shall show each changed entry that concerns the design parameter.
      next: When asked what is to do, the views shall show the first kinds of thing to do with every thing of one kind in one line.
      rules: When asked for the rules, the views shall list each rule with the settings of the rule.
      data: When asked for the data, the views shall show each structure under a design parameter with the design parameters that touch the structure.

  zigdag.core.init:
    statements:
      record: The init shall record existing code so that the first check of the code holds.
      default-setup: When asked for a default setup, the init shall write the settings, a starter record and each tunable rule with the default values of the rule.

  zigdag.adapters:
    serves: [keep-design-true.drift-unnoticed, change-safely.context-time]
    statements:
      read: The adapters shall read the code of each supported language into the code model.
      reports: When a linter or a type checker reports on the code, the adapters shall read each diagnostic from the Code Quality report of the tool.
      known: When the cli reads a project, the adapters shall give each adapter that the settings of the project set up.
      sarif: When a tool writes a SARIF report, the adapters shall read each diagnostic from the report.

  zigdag.adapters.interface:
    statements:
      ask: The interface shall name what the cli asks of each adapter.

  zigdag.adapters.presence:
    statements:
      hold: The presence shall name whether the shell found something that the cli looked for.

  zigdag.adapters.test_run:
    statements:
      hold: The test run shall give the command that runs the tests of one adapter.

  zigdag.adapters.profiling:
    statements:
      hold: The profiling shall give the command that runs the tests of one adapter under the profiler of the adapter.

  zigdag.adapters.tools:
    statements:
      run: The tools shall give the command that runs each tool that a rule needs.

  zigdag.adapters.tools.tool:
    statements:
      hold: The tool shall name a tool that an adapter runs on the source.

  zigdag.adapters.tools.tool_run:
    statements:
      hold: The tool run shall give the command that runs one tool on the source.

  zigdag.adapters.tools.tool_output:
    statements:
      hold: The tool output shall hold what the shell saw when the shell ran one tool.

  zigdag.adapters.tools.tool_start:
    statements:
      hold: The tool start shall name whether the shell started a tool.

  zigdag.adapters.typescript:
    statements:
      read: The typescript shall read the TypeScript source of a project into the code model.
      imports: When a file imports a name, the typescript shall follow the import to the module that declares the name.
      effects: When the code calls an API that has an effect, the typescript shall read the effect with the place that starts the effect.
      unread: If the parser cannot read a file, then the typescript shall report a question.
      tools: When a rule needs lint or type diagnostics, the typescript shall read what eslint or tsc report about the source.
      tests: When a test file declares a test, the typescript shall read the test with the statements that the name of the test verifies.
      values: When a function uses a value, the typescript shall read the constants, the parameters and the calls that the value comes from.
      profile: When the tests are profiled, the typescript shall read the time of each line from the CPU profile that Node writes.
      watched: When the watcher saw a test run, the typescript shall read the modules whose code ran while the test ran.
      contracts: When a function calls requires or ensures, the typescript shall read the function as one that states a contract.
      schemas: When a constant is a zod schema of an object, the typescript shall read the constant as a structure with the keys of the schema as fields.

  zigdag.adapters.typescript.type_script_files:
    statements:
      hold: The type script files shall hold the text that the shell read for the TypeScript adapter.

  zigdag.adapters.typescript.type_script_adapter:
    statements:
      choose: The type script adapter shall name the files of a project that the TypeScript adapter reads.

  zigdag.adapters.terraform:
    statements:
      read: The terraform shall read each resource of a rendered plan into the code model, with the resources that the resource references.
      locate: When the source writes a resource, the terraform shall place the resource at the block of the source.
      unrendered: If the source of a project has no rendered plan, then the terraform shall report a thing to do.
      untraced: If a resource refers to a local value, then the terraform shall report a question.
      older: If the source declares a resource that the rendered plan lacks, then the terraform shall report a thing to do.
      tests: When a test file holds a run, the terraform shall read the run as a test with the statements that the run verifies.
      plan-only: If a run applies while the project lets the tests only plan, then the terraform shall report a break.
      tools: When a rule needs lint or security diagnostics, the terraform shall read what tflint or trivy report about the source.
      grants: When a policy grants an action on a resource, the terraform shall read the grant with the role that holds the policy.
      written-policies: When a block writes a policy as text, the terraform shall read each statement of the policy from the source.
      connections: When a network rule lets one security group reach another, the terraform shall read the connection.
      settings: When a block gives a resource a setting that names another resource, the terraform shall read the setting.

  zigdag.adapters.terraform.mode:
    statements:
      hold: The mode shall name what the tests of a project do to the infrastructure.

  zigdag.adapters.terraform.terraform_files:
    statements:
      hold: The terraform files shall hold the text that the shell read for the Terraform adapter.

  zigdag.adapters.terraform.terraform_adapter:
    statements:
      choose: The terraform adapter shall name the files of a project that the Terraform adapter reads.

  zigdag.adapters.python:
    statements:
      read: The python shall read the Python source of a project into the code model, with the tests and the test reports of the project.
      tools: When a rule needs lint or type diagnostics, the python shall read what ruff or ty report about the source of the project.
      security: When a rule needs security diagnostics, the python shall read what bandit reports about the source of the project.
      profile: When the tests are profiled, the python shall read the time and the memory of each line from the profile that scalene writes.
      tool-failed: If a tool that a rule needs cannot report on the source, then the python shall report a break.
      resource-uses: When the code calls a client of a deployed resource, the python shall read the call with the setting that names the resource.

  zigdag.adapters.python.python_files:
    statements:
      hold: The python files shall hold the text that the shell read for the Python adapter.

  zigdag.adapters.python.watched_test:
    statements:
      hold: The watched test shall record one test with the units whose code ran while the test ran.

  zigdag.adapters.python.recording:
    statements:
      hold: The recording shall hold everything that one watched run of the tests saw.

  zigdag.adapters.python.python_adapter:
    statements:
      choose: The python adapter shall name the files of a project that the Python adapter reads.
      run: When the cli runs the tools or the tests of a project, the python adapter shall give the command of each run.

  zigdag.watchers:
    serves:
      - review-change.hollow-evidence
      - keep-design-true.hidden-effect
      - change-safely.data-mismatch
    statements:
      record: The watchers shall record what the code of a project does while the tests of the project run.

  zigdag.watchers.python:
    statements:
      watch: The python shall record the effects, calls and changes that the Python code of a project makes while the tests run.
      same-seed: When the watcher generates inputs, the python shall use the same seed in every run.
      mutate: When a function that is declared without effects has a contract, the python shall run the cases of the contract against each mutant of the body of the function.
      search: When nothing notices a mutant, the python shall search within a bound for an input that the mutant and the function behave differently on.
      carry: If a function and the tests that run the function are unchanged since the last run, then the python shall carry over the mutants of the function from the last run.

  zigdag.watchers.python.search_verdict:
    statements:
      hold: The search verdict shall name what the search for a differing input found.

  zigdag.checks:
    serves: [keep-design-true.drift-unnoticed]
    statements:
      offer: The checks shall offer the author of a custom check the context that a check reads.

  zigdag.agents:
    serves: [change-safely.late-feedback, change-safely.context-time]
    statements:
      install: The agents shall give a coding agent the skills and the hooks for working with zigdag.
      feedback: When an agent ends a turn, the agents shall report the breaks of the project to the agent.

  zigdag.cli:
    serves: [keep-design-true.drift-unnoticed]
    statements:
      run: The cli shall run a command on the project that the user names.
      test: When asked to test, the cli shall run the tests of the project with the watcher before the cli checks the project.
      work: When asked for work, the cli shall take the design parameter that the plans hand out.

  zigdag.cli.plans:
    statements:
      decide: The plans shall decide what each command does with what the cli read.
      ready: When asked whether a change is ready, the plans shall answer yes or no with each reason for a no.
      summary: When a command reports the findings in short, the plans shall show each direction of quality in one line with the file of the findings of the direction and the breaks of the direction.
      costs: When a profile of the tests exists, the plans shall show the time and the memory of each design parameter beside the cost of the design parameter in the run before.
      unchecked: If no adapter supplied what a rule reads at the base of a review, then the plans shall leave the findings of the rule out of what the change brought.
      part-branch: When a command runs on the branch of a design parameter, the plans shall tell the command the design parameter.
      part-ready: When asked whether the branch of a design parameter is ready, the plans shall hold the branch to the checks of a branch.
      built-waiting: If only tests that wait for another design parameter fail on the branch of a design parameter, then the plans shall answer that the design parameter is built.

  zigdag.cli.plans.runs:
    statements:
      hold: The runs shall hold how the tests run under the watcher and under the profiler.

  zigdag.cli.plans.runs.profiled_run:
    statements:
      hold: The profiled run shall tell how the tests run under the profiler, or why the tests cannot run under the profiler.

  zigdag.cli.plans.runs.watched_run:
    statements:
      hold: The watched run shall hold how the tests run under the watcher.

  zigdag.cli.plans.git_listing:
    statements:
      hold: The git listing shall give the paths that git listed at a revision, or the reason that git failed.

  zigdag.cli.plans.disk_layout:
    statements:
      hold: The disk layout shall locate what decides how a project on disk is read.

  zigdag.cli.plans.outcome:
    statements:
      hold: The outcome shall hold what a command writes, logs, prints and exits with.

  zigdag.cli.plans.reading:
    statements:
      hold: The reading shall decide which files of a project the cli reads.

  zigdag.cli.plans.write:
    statements:
      hold: The write shall hold one file with the text to write to the file.

  zigdag.cli.plans.view:
    statements:
      hold: The view shall name which view of the record a command shows.

  zigdag.cli.plans.git_error:
    statements:
      hold: The git error shall give the reason that git failed to read a revision.

  zigdag.cli.plans.branches:
    statements:
      hold: The branches shall hold what git says of the branches that design parameters are built on.

  zigdag.cli.plans.branches.git_answer:
    statements:
      hold: The git answer shall hold what git answered one question with.

  zigdag.cli.plans.branches.checkout_state:
    statements:
      hold: The checkout state shall hold the branch that is checked out in a folder with the branch that the branch tracks.

  zigdag.cli.plans.branches.part_checkout:
    statements:
      hold: The part checkout shall hold the branch of the design parameter that a command runs on, or the reason that the command cannot run.

  zigdag.cli.plans.branches.claimed_part:
    statements:
      hold: The claimed part shall hold a design parameter whose branch exists with the folder of the branch.

  zigdag.cli.plans.branches.claims:
    statements:
      hold: The claims shall hold every design parameter that is taken with the design files that are not committed.

  zigdag.cli.plans.branches.branch_claim:
    statements:
      hold: The branch claim shall hold the branch to make for a design parameter with the branch that the branch tracks.

  zigdag.cli.plans.branches.handout:
    statements:
      hold: The handout shall hold what the cli answers when asked for work with the branch to make first.

constraints:
  pure-core:  # the same text must always give the same findings
    on: zigdag.core
    serves: [keep-design-true.different-answers]
    check: effects
    with:
      allow: []

  pure-adapters:  # an adapter reads text it is given; the shell reads the files
    on: zigdag.adapters
    serves: [keep-design-true.different-answers]
    check: effects
    with:
      allow: []

  language-free-core:  # the core knows no language: only adapters do; deal states the core's contracts
    on: zigdag.core
    serves: [maintain.unrelated-breakage]
    check: may-depend-on
    with:
      allow: [ruamel, deal]

  adapters-feed-the-core:  # deal states the adapters' contracts
    on: zigdag.adapters
    serves: [maintain.unrelated-breakage]
    check: may-depend-on
    with:
      allow: [zigdag.core, deal, tree_sitter, tree_sitter_typescript]

  shell-effects:  # the environment carries the watch plan's path from zigdag test to the watcher; CrossHair is imported only when a search runs, since importing it turns contracts off
    on: zigdag
    serves: [keep-design-true.different-answers]
    check: effects
    with:
      allow: [read, write, stdin, stdout, stderr, syscall, time, env, import]

  pure-cli-plans:  # the cli decides in its plans, and only carries them out elsewhere
    on: zigdag.cli.plans
    serves: [maintain.unrelated-breakage]
    check: effects
    with:
      allow: []

  pure-agents:  # the agents only make the text of skills and hooks; the cli writes it
    on: zigdag.agents
    serves: [maintain.unrelated-breakage]
    check: effects
    with:
      allow: []

  watchers-decide-purely:  # the watchers decide in pure code; only these functions have effects
    on: zigdag.watchers
    serves: [maintain.unrelated-breakage]
    check: effects
    with:
      allow: []
    except:
      - python.pytest_configure
      - python._Hooks.pytest_sessionfinish
      - python.watcher.Watcher.start
      - python.watcher.Watcher.end
      - python.watcher.Watcher.printed
      - python.watcher.Watcher.finish
      - python.watcher.Watcher.mutate
      - python.mutants.mutants
      - python.mutants._fate
      - python.mutants._limit
      - python.mutants._compiled  # it runs the project's own edited code with exec
      - python.mutants._searched
      - python.search.search
      - python.search._crosshair
